[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-scalper"
version = "0.1.0"
description = "Strict rule-based XAUUSD M5 scalping analyzer"
requires-python = ">=3.11"

[project.scripts]
xauusd-scalper = "xauusd_scalper.cli:main"

[tool.setuptools.packages.find]
include = ["xauusd_scalper*"]
